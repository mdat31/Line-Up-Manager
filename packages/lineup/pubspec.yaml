name: lineup
description: Embeddable line-up manager for amateur, futsal and grassroots teams.
publish_to: 'none'
version: 0.1.0
resolution: workspace

environment:
  sdk: ^3.13.0

dependencies:
  equatable: ^3.0.0
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  gal: ^2.3.3
  path: ^1.9.1
  path_provider: ^2.1.6
  share_plus: ^13.3.1
  sqflite: ^2.4.5

flutter:
  assets:
    - assets/images/

  fonts:
    # Oswald: condensed display face with full Vietnamese coverage (OFL).
    - family: Oswald
      fonts:
        - asset: assets/fonts/Oswald-Regular.ttf
        - asset: assets/fonts/Oswald-Bold.ttf
          weight: 700
dev_dependencies:
  bloc_test: ^10.0.0
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.5
  sqflite_common_ffi: ^2.4.5
