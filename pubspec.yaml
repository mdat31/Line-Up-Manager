name: marozi
description: Line-up manager for amateur, futsal and grassroots football teams.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.0

workspace:
  - packages/lineup

dependencies:
  cached_network_image: ^4.0.5
  carousel_slider: ^5.1.2
  cloud_firestore: ^7.1.0
  cupertino_icons: ^2.0.0
  equatable: ^3.0.0
  expandable: ^5.0.1
  firebase_analytics: ^13.0.1
  firebase_auth: ^7.0.1
  firebase_core: ^5.1.0
  firebase_messaging: ^17.0.1
  firebase_storage: ^14.0.1
  flutter:
    sdk: flutter
  lineup:
    path: packages/lineup
  flutter_bloc: ^9.1.1
  gal: ^2.3.3
  path_provider: ^2.1.6
  permission_handler: ^13.0.2
  recase: ^4.1.0
  screenshot: ^3.0.0
  share_plus: ^13.3.1
  sqflite: ^2.4.5

dev_dependencies:
  bloc_test: ^10.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.5

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  remove_alpha_ios: true
  image_path: "assets/images/logo.png"

flutter:
  uses-material-design: true

  assets:
    - assets/images/

  fonts:
    - family: San Francisco Display Medium
      fonts:
        - asset: assets/fonts/San-Francisco-Display-Medium.ttf
    - family: San Francisco Display Regular
      fonts:
        - asset: assets/fonts/San-Francisco-Display-Regular.ttf
    - family: CustomIcon
      fonts:
        - asset: assets/fonts/CustomIcon.ttf
    - family: Bruno Ace Regular
      fonts:
        - asset: assets/fonts/Bruno-Ace-Regular.ttf
    - family: Cagliostro Regular
      fonts:
        - asset: assets/fonts/Cagliostro-Regular.ttf
    - family: Teko Regular
      fonts:
        - asset: assets/fonts/Teko-Regular.ttf
    - family: BlackOpsOne Regular
      fonts:
        - asset: assets/fonts/BlackOpsOne-Regular.ttf
    - family: Bangers Regular
      fonts:
        - asset: assets/fonts/Bangers-Regular.ttf
    - family: Consolas Bold
      fonts:
        - asset: assets/fonts/Consolas-Bold.ttf
